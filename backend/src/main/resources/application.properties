spring.application.name=employee-management-system

# --- MySQL Configuration ---
# The URL to connect to our MySQL database. 'ems_db' is the name of our database.
spring.datasource.url=jdbc:mysql://localhost:3306/ems_db?useSSL=false&serverTimezone=UTC
# Your MySQL username (usually 'root')
spring.datasource.username=root
# Your MySQL password (make sure this matches your local MySQL password)
spring.datasource.password=root

# --- Hibernate (JPA) Configuration ---
# 'update' means Spring will automatically create or update tables based on our Java classes.
spring.jpa.hibernate.ddl-auto=update
# Shows the SQL queries Spring is running in the console (useful for debugging)
spring.jpa.show-sql=true
# Specifies which database version we are using.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# --- Server Configuration ---
# The port our backend API will run on.
server.port=8080
